<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan de Valor Ganado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Plan de Valor Ganado</h1>
    <p id="corte"></p>
  </header>
  <main>
    <section id="kpis"></section>
    <details id="glosario"></details>
    <div class="graficas">
      <section>
        <h2>Valor: planeado vs ganado (puntos)</h2>
        <canvas id="valor"></canvas>
      </section>
      <section>
        <h2>Costo: planeado vs real (horas)</h2>
        <canvas id="costo"></canvas>
      </section>
    </div>
    <section>
      <h2>WBS y dependencias</h2>
      <div id="grafo"></div>
    </section>
    <section>
      <h2>Actividades</h2>
      <table id="tabla"></table>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
